    cron: "0 0 0 * * *" # 매일 저녁 00시 00분 (자정) 자동 전송
    sender: "cloud@fatesinc.com"
    recipient: "cloud@fatesinc.com"
    log-file-path: "logs/fates-system.log"

  # ─────────────────────────────────────────────────────────
  # 선사별 공식 API 설정
  # 각 선사 개발자 포털에서 발급받은 API Key를 입력하거나
  # 환경변수(ONE_API_KEY 등)로 주입하세요.
  # ─────────────────────────────────────────────────────────

logging:
  file:
    name: "logs/fates-system.log"
  logback:
    rollingpolicy:
      max-file-size: "10MB"
      max-history: 7


