<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="grad_slide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#438a5e" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a1128" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="grid_slide" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="600" fill="url(#grad_slide)"/>
  <rect width="1200" height="600" fill="url(#grid_slide)"/>
  <circle cx="1000" cy="200" r="250" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="2"/>
  <circle cx="1000" cy="200" r="150" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <text x="80" y="270" font-family="'Noto Sans KR', sans-serif" font-size="44" font-weight="bold" fill="#ffffff">식료 · 유통 (Food & Retail)</text>
  <text x="80" y="330" font-family="'Noto Sans KR', sans-serif" font-size="22" fill="#90e0ef">[이미지 교체 가이드] 권장 규격: 1920x800 px</text>
  <text x="80" y="375" font-family="sans-serif" font-size="16" fill="rgba(255,255,255,0.5)">client/public/images/slide-food.svg 파일을 원하시는 사진으로 바꾸실 수 있습니다.</text>
</svg>