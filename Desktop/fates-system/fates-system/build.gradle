plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'com.sun.mail:jakarta.mail:2.0.1'

	// Google APIs & Auth
	implementation 'com.google.api-client:google-api-client:2.7.0'
	implementation 'com.google.oauth-client:google-oauth-client-jetty:1.36.0'
	implementation 'com.google.apis:google-api-services-gmail:v1-rev20260727-2.0.0'
	implementation 'com.google.apis:google-api-services-calendar:v3-rev20240705-2.0.0'
	implementation 'com.google.apis:google-api-services-sheets:v4-rev20250211-2.0.0'
	implementation 'com.google.apis:google-api-services-drive:v3-rev20240123-2.0.0'
	implementation 'com.google.cloud:google-cloud-secretmanager:2.55.0'
	implementation 'com.google.auth:google-auth-library-oauth2-http:1.30.0'
	implementation 'com.google.http-client:google-http-client-gson:1.45.1'

	// Jackson
	implementation 'com.fasterxml.jackson.core:jackson-databind'
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
