    private-key: ${GOOGLE_PRIVATE_KEY:}
    secret-manager:
      enabled: true
      project-id: "650454847556"
      secret-name: "FATES-NEWSLETTER"
      version: "latest"
  
  calendars:
    korea: "en.south_korea#holiday@group.v.calendar.google.com"
